plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir('src/generated/resources') }

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }

    // Create 6.0.10 development dependencies.
    // Per Create's official NeoForge 1.21.1 addon setup, use the slim Create
    // artifact non-transitively and resolve only its required dev libraries.
    maven { url = 'https://maven.createmod.net' } // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
    maven { url = 'https://www.cursemaven.com' } // Optional Croptopia dev runtime
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {}
    server { argument '--nogui' }
    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Development-only Croptopia compatibility runtime. This does not make Croptopia a
    // production dependency of Tobacconist. Disable with -Pcroptopia_runtime_enabled=false.
    def croptopiaRuntimeEnabled = providers.gradleProperty('croptopia_runtime_enabled')
        .orElse('true').get().toBoolean()
    if (croptopiaRuntimeEnabled) {
        localRuntime "curse.maven:croptopia-415438:7958876"
        localRuntime "curse.maven:epherolib-885449:5872111"
    }

    // Create is optional for production, but when enabled in the dev runtime it must use
    // Create's documented development dependency layout so NeoForge actually loads it.
    def createRuntimeEnabled = providers.gradleProperty('create_runtime_enabled')
        .orElse('false').get().toBoolean()

    if (createRuntimeEnabled) {
        implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
        implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1"
        compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
        runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
        implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    } else {
        // Keep Create APIs available to compile compatibility code without loading Create.
        compileOnly("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
        compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1"
        compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
        compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
}
