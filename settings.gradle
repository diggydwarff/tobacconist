pluginManagement {
    repositories { gradlePluginPortal(); maven { url = 'https://maven.minecraftforge.net/' }; maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    resolutionStrategy { eachPlugin {
        if (requested.id.id == 'net.minecraftforge.gradle') useModule('net.minecraftforge.gradle:ForgeGradle:6.0.36')
        if (requested.id.id == 'org.spongepowered.mixin') useModule('org.spongepowered:mixingradle:0.7-SNAPSHOT')
    } }
}
rootProject.name = 'tobacconistmod'
